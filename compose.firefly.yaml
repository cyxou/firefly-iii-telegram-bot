# DEV-ONLY: local Firefly III + MariaDB for bot development (reads .firefly.env
# and .db.env). The user-facing bot stack is compose.yaml.
volumes:
  firefly_iii_upload:
  firefly_iii_db:

networks:
  firefly_iii:
    driver: bridge

services:
  app:
    image: fireflyiii/core:version-6.7.9
    hostname: app
    container_name: firefly_iii_core
    restart: always
    volumes:
      - firefly_iii_upload:/var/www/html/storage/upload
    env_file: .firefly.env
    networks:
      - firefly_iii
    ports:
      - 8888:8080
    depends_on:
      - db

  db:
    image: mariadb
    hostname: db
    container_name: firefly_iii_db
    restart: always
    env_file: .db.env
    networks:
      - firefly_iii
    volumes:
      - firefly_iii_db:/var/lib/mysql

