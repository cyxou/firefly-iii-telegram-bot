# DEV-ONLY: local Firefly III + Postgres + Redis for bot development.
#
# Worktree-safe: no container_name, all host ports via env vars (FF_PORT,
# REDIS_PORT) so stacks in parallel git worktrees don't collide. Volumes and
# networks are namespaced by the compose project name (= directory basename).
services:
  app:
    image: fireflyiii/core:version-6.7.9
    restart: unless-stopped
    volumes:
      - firefly_iii_upload:/var/www/html/storage/upload
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      # Dev-only key, committed on purpose: Firefly encrypts some columns
      # with APP_KEY, and a stable key keeps re-created stacks and PATs valid.
      APP_KEY: base64:Jdm9xFeMYtPbhMzwJoAFqNKpwq7kDN5kfHXvP8sFctI=
      SITE_OWNER: dev@example.com
      DEFAULT_LANGUAGE: en_US
      TZ: Europe/Amsterdam
      APP_URL: http://localhost:${FF_PORT:-8888}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      DB_PASSWORD: firefly
    networks:
      - firefly_iii
    ports:
      - ${FF_PORT:-8888}:8080
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: firefly
      POSTGRES_PASSWORD: firefly
      POSTGRES_DB: firefly
    volumes:
      - firefly_pg:/var/lib/postgresql/data
      # Optional: any *.sql / *.sql.gz dump dropped into ./seed/ is
      # auto-restored into a fresh data volume (see seed/README.md).
      - ./seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, not the unix socket: the image's initdb phase runs a temporary
      # socket-only server that would otherwise read as healthy mid-restore.
      test: ['CMD-SHELL', 'pg_isready -U firefly -d firefly -h localhost']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - firefly_iii

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # no volume on purpose: sessions are ephemeral (24h TTL) — a wipe is harmless
    ports:
      - ${REDIS_PORT:-6379}:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - firefly_iii

volumes:
  firefly_iii_upload:
  firefly_pg:

networks:
  firefly_iii:
    driver: bridge
