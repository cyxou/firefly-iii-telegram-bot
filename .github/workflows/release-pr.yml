name: Release PR

# Manual bump: pick the level, get a release PR; merging it cuts the release
# (see scripts/open-release-pr.sh). Major releases stay manual.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump level
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor

# Serialize double-taps: a queued second run re-computes the next version from
# fresh master instead of racing the first to the same branch.
concurrency:
  group: release-pr
  cancel-in-progress: false

permissions:
  contents: write # push the release branch
  pull-requests: write # open the release PR

jobs:
  release-pr:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download Earthly
        run: "sudo /bin/sh -c 'wget https://github.com/earthly/earthly/releases/download/v0.8.16/earthly-linux-amd64 -O /usr/local/bin/earth && chmod +x /usr/local/bin/earth'"

      - name: Open release PR
        # no --ci: it implies --strict, which forbids LOCALLY targets
        run: earth +open-release-pr --BUMP='${{ inputs.bump }}' --GH_TOKEN=${{ github.token }}
